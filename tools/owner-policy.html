    owner: 'Owner', broker: 'Broker',
    f: { name: 'Name', id: 'ID / Iqama No.', phone: 'Mobile', prop: 'Property (district / address)', sign: 'Signature', date: 'Date' },
    brokerName: 'Abdullah — Madinah Group'
  }
};

(function () {
  var lang = (location.search.match(/lang=(\w+)/) || [])[1] || 'ar';
  var d = DOC[lang] || DOC.ar;
  document.documentElement.lang = d.lang;
  document.body.dir = d.dir;
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function num(n) {
    var s = String(n);
    return d.digits ? s.replace(/\d/g, function (x) { return x === '0' ? '٠' : d.digits[x - 1]; }) : s;
  }
  function line(label, value) {
    return '<div class="line"><span>' + esc(label) + ':</span>' + (value ? '<em>' + esc(value) + '</em>' : '<i></i>') + '</div>';
  }
  var h = '<header class="head">' +
      '<div class="medal"><img src="../assets/img/emblem.webp" alt=""></div>' +
      '<h1>' + esc(d.title) + '</h1>' +
      '<div class="sub">' + esc(d.sub) + '</div>' +
      '<div class="ver">' + esc(d.ver) + '</div>' +
      '<div class="rule">' + STAR + '</div>' +
    '</header>' +
    '<div class="intro">' + esc(d.intro) + '</div>';
  d.clauses.forEach(function (c, i) {
    h += '<section class="clause"><div class="num">' + num(i + 1) + '</div><div><h2>' + esc(c.t) + '</h2><ul>' +
      c.items.map(function (it) {
        return typeof it === 'string' ? '<li>' + esc(it) + '</li>' : '<li class="ex">' + esc(it.ex) + '</li>';
      }).join('') + '</ul></div></section>';
  });
  h += '<div class="note">' + esc(d.note) + '</div>' +
    '<section class="signs"><h3>' + esc(d.signs) + '</h3><div class="sign-grid">' +
      '<div class="box"><b>' + esc(d.owner) + '</b>' +
        line(d.f.name) + line(d.f.id) + line(d.f.phone) + line(d.f.prop) + line(d.f.sign) + line(d.f.date) +
      '</div>' +
      '<div class="box"><b>' + esc(d.broker) + '</b>' +
        line(d.f.name, d.brokerName) + line(d.f.phone) + line(d.f.sign) + line(d.f.date) +
      '</div>' +
    '</div></section>';
  document.getElementById('doc').innerHTML = h;
  document.title = d.title;
  window.__footer = { dir: d.dir, left: 'Madinah Group · ' + d.title, page: lang === 'ar' ? 'صفحة' : lang === 'ru' ? 'Стр.' : 'Page', of: lang === 'ar' ? 'من' : lang === 'ru' ? 'из' : 'of' };
  Promise.all([document.fonts.ready, new Promise(function (r) {
    var img = document.querySelector('.medal img');
    if (img.complete) r(); else { img.onload = r; img.onerror = r; }
  })]).then(function () { window.__ready = true; });
})();
</script>
</body>
</html>
